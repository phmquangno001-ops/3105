name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Certificates and Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "1" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "1" $KEYCHAIN_PATH

          # Setup Provisioning Profile
          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/cert.mobileprovision
          elif [ -f "ci_certs/cert.mobileprovision" ]; then
            cp "ci_certs/cert.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
          elif [ -f "certificate 2/cert.mobileprovision" ]; then
            cp "certificate 2/cert.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
          elif [ -f "ci_certs/cert_provision.b64" ]; then
            cat "ci_certs/cert_provision.b64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/cert.mobileprovision
          fi

          # Setup PKCS#12 Certificate
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          elif [ -f "ci_certs/cert.p12" ]; then
            cp "ci_certs/cert.p12" $RUNNER_TEMP/cert.p12
          elif [ -f "certificate 2/cert.p12" ]; then
            cp "certificate 2/cert.p12" $RUNNER_TEMP/cert.p12
          elif [ -f "ci_certs/cert_p12.b64" ]; then
            cat "ci_certs/cert_p12.b64" | base64 --decode > $RUNNER_TEMP/cert.p12
          fi

          if [ -f "$RUNNER_TEMP/cert.p12" ]; then
            security import "$RUNNER_TEMP/cert.p12" -P "1" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH || true
            security set-key-partition-list -S apple-tool:,apple: -s -k "1" $KEYCHAIN_PATH || true
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[ \t]*//;s/"//g')
          fi

      - name: Build Xcode Project
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" 2>/dev/null | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | head -n 1 | sed 's/^[ \t]*//')
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="ThreeOneOSFive"
          fi
          echo "Project: $PROJECT_PATH, Scheme: $SCHEME_NAME"

          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO || \
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Package IPA
        run: |
          mkdir -p build_output/Payload
          APP_DIR=$(find "$RUNNER_TEMP/DerivedData" -type d -name "*.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -type d -name "*.app" | grep -v "Pods" | head -n 1)
          fi

          if [ -n "$APP_DIR" ]; then
            echo "Found App bundle at: $APP_DIR"
            cp -R "$APP_DIR" build_output/Payload/
            cd build_output
            zip -qr "3105.ipa" Payload
            cd ..
          else
            echo "Error: App bundle could not be found!" && exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: build_output/*.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: build_output/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
