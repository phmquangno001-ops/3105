      - name: Build Archive & App
        run: |
          cd "${{ env.PROJECT_DIR }}"
          PROJ_NAME=$(basename "${{ env.PROJ_PATH }}")
          
          echo "Building scheme ThreeOneOSFive with project $PROJ_NAME..."
          xcodebuild clean build archive \
            -project "$PROJ_NAME" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ThreeOneOSFive.xcarchive" \
            -destination "generic/platform=iOS" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO