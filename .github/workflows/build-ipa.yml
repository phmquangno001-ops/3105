name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || true
          xcodebuild -version

      - name: Locate Xcode Project
        id: locate-proj
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -maxdepth 3 | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          fi
          echo "PROJ_PATH=$PROJ_PATH" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$PROJ_PATH")" >> $GITHUB_ENV
          echo "Project found at: $PROJ_PATH"

      - name: Setup Apple Certificates & Keychain
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Tim va chep provisioning profile
          PROV_FILE=""
          for candidate in "ci_certs/cert.mobileprovision" "certificate 2/cert.mobileprovision" "cert.mobileprovision"; do
            if [ -f "$candidate" ]; then
              PROV_FILE="$candidate"
              break
            fi
          done
          
          if [ -n "$PROV_FILE" ]; then
            cp "$PROV_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/cert.mobileprovision
            echo "Installed provisioning profile from $PROV_FILE"
          elif [ -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" ]; then
            echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/cert.mobileprovision
            echo "Decoded provisioning profile from secrets."
          fi
          
          # Setup Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "1" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "1" $KEYCHAIN_PATH
          
          # Tim va import cert.p12 (Pass: 1)
          P12_FILE=""
          for candidate in "ci_certs/cert.p12" "certificate 2/cert.p12" "cert.p12"; do
            if [ -f "$candidate" ]; then
              P12_FILE="$candidate"
              break
            fi
          done
          
          if [ -n "$P12_FILE" ]; then
            security import "$P12_FILE" -P "1" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH || true
            echo "Imported P12 from $P12_FILE"
          elif [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            echo "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import "$RUNNER_TEMP/cert.p12" -P "1" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH || true
            echo "Imported P12 from secrets."
          fi
          
          security set-key-partition-list -S apple-tool:,apple: -s -k "1" $KEYCHAIN_PATH || true
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Archive & App
        run: |
          cd "${{ env.PROJECT_DIR }}"
          PROJ_NAME=$(basename "${{ env.PROJ_PATH }}")
          
          echo "Building scheme ThreeOneOSFive with project $PROJ_NAME..."
          xcodebuild clean build archive \
            -project "$PROJ_NAME" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ThreeOneOSFive.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            || xcodebuild clean build \
            -project "$PROJ_NAME" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build_output/Payload
          
          APP_DIR=$(find "$RUNNER_TEMP" . -type d -name "*.app" | grep -v "Pods" | head -n 1)
          echo "Found app directory: $APP_DIR"
          
          if [ -z "$APP_DIR" ]; then
            echo "No .app bundle found! Aborting." >&2
            exit 1
          fi
          
          cp -R "$APP_DIR" build_output/Payload/
          
          # Nhúng Mobileprovision nếu có
          if [ -f ~/Library/MobileDevice/Provisioning\ Profiles/cert.mobileprovision ]; then
            cp ~/Library/MobileDevice/Provisioning\ Profiles/cert.mobileprovision build_output/Payload/$(basename "$APP_DIR")/embedded.mobileprovision || true
          fi
          
          cd build_output
          zip -qr "ThreeOneOSFive.ipa" Payload
          cd ..
          
          echo "IPA package created successfully at build_output/ThreeOneOSFive.ipa"
          ls -lh build_output/ThreeOneOSFive.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: build_output/ThreeOneOSFive.ipa

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release 3105 v1.0.${{ github.run_number }}"
          files: build_output/ThreeOneOSFive.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}