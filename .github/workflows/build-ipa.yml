name: Build iOS IPA & Deploy

on:
  workflow_dispatch:
    inputs:
      auto_fix_attempt:
        description: 'Auto-fix attempt counter'
        required: false
        default: '0'
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.3.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Apple Certificate & Configure Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD="${KEYCHAIN_PASSWORD:-buildpassword123}"

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Import Apple WWDR Intermediate Certificates to validate chain
          curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/WWDRG3.cer || true
          if [ -f "$RUNNER_TEMP/WWDRG3.cer" ]; then
            security import "$RUNNER_TEMP/WWDRG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          fi

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            
            # Import certificate & private key (do NOT use -t cert)
            security import "$CERTIFICATE_PATH" -P "${P12_PASSWORD:-1}" -A -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            echo "Imported certificates into keychain:"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          else
            echo "No BUILD_CERTIFICATE_BASE64 provided, using ad-hoc codesigning fallback."
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            PROFILE_RAW=$RUNNER_TEMP/profile.mobileprovision
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_RAW"

            UUID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "")
            if [ -n "$UUID" ]; then
              echo "Provisioning Profile UUID: $UUID"
              cp "$PROFILE_RAW" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
              echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
            fi

            TEAM_ID=$(security cms -D -i "$PROFILE_RAW" 2>/dev/null | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo "")
            if [ -n "$TEAM_ID" ]; then
              echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
              echo "Team ID: $TEAM_ID"
            fi
          fi

      - name: Setup Dependencies
        run: |
          if [ -f "Podfile" ]; then
            echo "Installing CocoaPods..."
            pod install --repo-update || pod install
          fi
          if [ -f "package.json" ]; then
            echo "Node dependencies detected"
            npm ci || npm install
          fi

      - name: Prepare ExportOptions.plist
        run: |
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Build Archive & Export IPA
        run: |
          mkdir -p build/output

          # Locate project or workspace
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            BUILD_TARGET="-workspace $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            BUILD_TARGET="-project $PROJECT"
          else
            if [ -d "Payload" ]; then
              echo "Existing Payload found, packing into IPA directly..."
              zip -r build/output/App.ipa Payload
              exit 0
            fi
            echo "::error::No Xcode project found."
            exit 1
          fi

          # Detect scheme
          SCHEME="ThreeOneOSFive"
          DETECTED_SCHEME=$(xcodebuild $BUILD_TARGET -list -json 2>/dev/null | plutil -extract project.schemes.0 raw - 2>/dev/null || echo "$SCHEME")
          if [ -n "$DETECTED_SCHEME" ]; then
            SCHEME="$DETECTED_SCHEME"
          fi
          echo "Using scheme: $SCHEME"

          # Check if valid identity exists in keychain
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep -o '".*"' | head -n 1 | tr -d '"' || true)

          # Attempt archiving with code signing disabled or ad-hoc to prevent profile mismatch aborts
          echo "Archiving with xcodebuild..."
          if [ -n "$SIGN_IDENTITY" ] && [ -n "$PROVISIONING_PROFILE_UUID" ]; then
            echo "Attempting signed archive with profile $PROVISIONING_PROFILE_UUID..."
            xcodebuild clean archive \
              $BUILD_TARGET \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              -destination "generic/platform=iOS" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
              DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM:-}" \
              COMPILER_INDEX_STORE_ENABLE=NO || true
          fi

          if [ ! -d "build/App.xcarchive" ]; then
            echo "Building archive with CODE_SIGNING_ALLOWED=NO fallback..."
            xcodebuild clean archive \
              $BUILD_TARGET \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO
          fi

          # Export IPA via xcodebuild or direct Payload packaging
          EXPORT_SUCCESS=0
          if [ -f "ExportOptions.plist" ]; then
            echo "Attempting xcodebuild export..."
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/output \
              -allowProvisioningUpdates || true
          fi

          IPA_FILE=$(find build/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "xcodebuild exportArchive skipped or failed. Packaging IPA directly from archive..."
            APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "::error::No .app found in xcarchive!"
              exit 1
            fi

            # Apply ad-hoc signature if unsigned
            SIGN_TARGET="${SIGN_IDENTITY:--}"
            codesign --force --deep --sign "$SIGN_TARGET" "$APP_PATH" 2>/dev/null || true

            mkdir -p build/output/Payload
            cp -R "$APP_PATH" build/output/Payload/
            cd build/output
            zip -qry "ThreeOneOSFive.ipa" Payload
            rm -rf Payload
            cd - > /dev/null
          fi

          FINAL_IPA=$(find build/output -name "*.ipa" | head -n 1)
          if [ -z "$FINAL_IPA" ]; then
            echo "::error::No IPA file found in build/output!"
            exit 1
          fi
          echo "Successfully created IPA: $FINAL_IPA"
          echo "IPA_PATH=$FINAL_IPA" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-build
          path: build/output/*.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          IPA_NAME=$(basename "$IPA_PATH")

          gh release create "$TAG" "$IPA_PATH" \
            --title "iOS Build ${TAG}" \
            --notes "Tự động build thành công bằng IPA AutoBuilder. File đính kèm: ${IPA_NAME}" \
            --latest || true

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_OUTPUT
